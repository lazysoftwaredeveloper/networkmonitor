name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Package app
        run: ./Scripts/build-app.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: NetworkMonitor-macOS
          path: build/NetworkMonitor.app
          if-no-files-found: error
